name: Deploy to Server

# Every push to main goes live. Docs-only changes don't trigger a deploy.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd "/root/my_project/session_creator"
            git fetch -q origin "main"
            # run the deploy script from the commit being deployed (not the old checkout)
            git show "origin/main:deploy/deploy.sh" > "/run/deploy-session_creator.sh"
            bash "/run/deploy-session_creator.sh" "origin/main"
