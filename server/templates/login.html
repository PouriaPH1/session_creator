<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود مدیر | Session Creator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; font-family: Tahoma, sans-serif; padding: 24px; }
    main { width: 100%; max-width: 400px; padding: 32px; border: 1px solid #334155; border-radius: 20px; background: #0f172a; }
    h1 { font-size: 23px; margin: 0 0 28px; }
    label { display: block; font-size: 14px; margin: 20px 0 8px; }
    input, button { font: inherit; width: 100%; padding: 12px; border-radius: 9px; }
    input { border: 1px solid #475569; background: #020617; color: white; direction: ltr; }
    input:focus { outline: 2px solid #818cf8; }
    button { border: 0; margin-top: 26px; background: #4f46e5; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <h1>ورود به پنل مدیریت</h1>
    <form id="login-form">
      <label for="username">نام کاربری</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">رمز عبور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="submit" type="submit">ورود</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('submit');
      const error = document.getElementById('error');
      error.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(typeof data.detail === 'string' ? data.detail : 'اطلاعات ورود معتبر نیست.');
        }
        location.replace('/');
      } catch (failure) {
        error.textContent = failure.message || 'ارتباط با سرور برقرار نشد.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
